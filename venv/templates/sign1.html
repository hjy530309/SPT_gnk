<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입창</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}"> <!-- 외부 CSS 파일 연결 -->
</head>
<body>

<div class="signup">
    <h2>goonaeka 만들기</h2>
    <form action="#" method="post">
        <div class="input-box">
            <label for="confirm-password">아이디</label>
            <input type="text" id="id" name="name"placeholder="아이디를 입력해주세요" required>
        </div>
        <div class="input-box">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="pwd"placeholder="비밀번호를 입력해주세요" required>
        </div>
        <div class="input-box">
            <label for="confirm-password">비밀번호 확인</label>
            <input type="password" id="confirm-password" name="confirm_pwd"placeholder="비밀번호를 다시 입력해주세요" required>
        </div>
        <button type="submit">회원가입</button>
    </form>
</div>

</body>
</html>
